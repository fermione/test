<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>北京天气</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="container">
    <h1>北京天气</h1>
    <div id="weather">
      <p id="location">城市：北京</p>
      <p id="temperature">气温：--</p>
      <p id="description">天气：--</p>
      <p id="sunrise">日出：--</p>
      <p id="sunset">日落：--</p>
    </div>
    <button id="refresh">刷新天气</button>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
